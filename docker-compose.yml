services:
  postgres:
    image: postgres:16-alpine
    container_name: sdd-memory-postgres
    environment:
      POSTGRES_USER: sdd_user
      POSTGRES_PASSWORD: sdd_password
      POSTGRES_DB: sdd_cloud
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdd_user -d sdd_cloud"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sdd-cloud-pg:/var/lib/postgresql/data

volumes:
  sdd-cloud-pg:
