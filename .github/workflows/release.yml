name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Build binaries
      run: |
        # Create dist directory
        mkdir -p dist
        
        # Build for different platforms
        GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/sdd-memory-linux-amd64 ./cmd/sdd-memory
        GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o dist/sdd-memory-linux-arm64 ./cmd/sdd-memory
        GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o dist/sdd-memory-darwin-amd64 ./cmd/sdd-memory
        GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o dist/sdd-memory-darwin-arm64 ./cmd/sdd-memory
        GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/sdd-memory-windows-amd64.exe ./cmd/sdd-memory
        GOOS=windows GOARCH=arm64 go build -ldflags "-s -w" -o dist/sdd-memory-windows-arm64.exe ./cmd/sdd-memory
        
        # Create universal binaries for easier download
        cp dist/sdd-memory-linux-amd64 dist/sdd-memory-linux
        cp dist/sdd-memory-darwin-amd64 dist/sdd-memory-macos
        cp dist/sdd-memory-windows-amd64.exe dist/sdd-memory-windows.exe
    
    - name: Create checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        release_name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        body: |
          ## Installation Options
          
          ### 1. Quick Install (Linux/macOS)
          ```bash
          curl -sSL https://raw.githubusercontent.com/KevG1t/sdd-memory/main/install.sh | bash
          ```
          
          ### 2. Quick Install (Windows PowerShell)
          ```powershell
          irm https://raw.githubusercontent.com/KevG1t/sdd-memory/main/install.ps1 | iex
          ```
          
          ### 3. Manual Download
          Download the appropriate binary for your platform below.
          
          ### 4. Go Install (if you have Go)
          ```bash
          go install github.com/KevG1t/sdd-memory/cmd/sdd-memory@${{ steps.get_version.outputs.VERSION }}
          ```
    
    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/sdd-memory-linux
        asset_name: sdd-memory-linux
        asset_content_type: application/octet-stream
    
    - name: Upload macOS binary
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/sdd-memory-macos
        asset_name: sdd-memory-macos
        asset_content_type: application/octet-stream
    
    - name: Upload Windows binary
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/sdd-memory-windows.exe
        asset_name: sdd-memory-windows.exe
        asset_content_type: application/octet-stream
    
    - name: Upload all platform binaries
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/checksums.txt
        asset_name: checksums.txt
        asset_content_type: text/plain