name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  
jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Build binaries
      run: |
        # Create dist directory
        mkdir -p dist
        
        # Build for different platforms
        GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/sdd-memory-linux-amd64 ./cmd/sdd-memory
        GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o dist/sdd-memory-linux-arm64 ./cmd/sdd-memory
        GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o dist/sdd-memory-darwin-amd64 ./cmd/sdd-memory
        GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o dist/sdd-memory-darwin-arm64 ./cmd/sdd-memory
        GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/sdd-memory-windows-amd64.exe ./cmd/sdd-memory
        GOOS=windows GOARCH=arm64 go build -ldflags "-s -w" -o dist/sdd-memory-windows-arm64.exe ./cmd/sdd-memory
        
        # Create universal binaries for easier download
        cp dist/sdd-memory-linux-amd64 dist/sdd-memory-linux
        cp dist/sdd-memory-darwin-amd64 dist/sdd-memory-macos
        cp dist/sdd-memory-windows-amd64.exe dist/sdd-memory-windows.exe
    
    - name: Create checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Publish to NPM
      run: |
        cd npm-package
        # Actualizar versión para coincidir con el tag de Git
        npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version --allow-same-version
        npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: |
          dist/sdd-memory-linux
          dist/sdd-memory-macos
          dist/sdd-memory-windows.exe
          dist/checksums.txt
        body: |
          ## Installation Options
          
          ### 1. Quick Install (Linux/macOS)
          ```bash
          curl -sSL https://raw.githubusercontent.com/KevG1t/sdd-memory/master/install.sh | bash
          ```
          
          ### 2. Quick Install (Windows PowerShell)
          ```powershell
          irm https://raw.githubusercontent.com/KevG1t/sdd-memory/master/install.ps1 | iex
          ```
          
          ### 3. Manual Download
          Download the appropriate binary for your platform below.
          
          ### 4. NPM Install
          ```bash
          npx sdd-memory-kevg1t
          ```
          
          ### 5. Go Install (if you have Go)
          ```bash
          go install github.com/KevG1t/sdd-memory/cmd/sdd-memory@${{ steps.get_version.outputs.VERSION }}
          ```